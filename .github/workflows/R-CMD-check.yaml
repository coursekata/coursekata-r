on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

name: R-CMD-check

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    timeout-minutes: 45

    # a row may name itself; `r` is the name when it does not. Two rows run
    # `release` and only one of them pins a floor, so they cannot share a name.
    name: ${{ matrix.config.os }} (${{ matrix.config.label || matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - os: macos-latest
            r: release
            lc-ctype: en_US.UTF-8

          - os: ubuntu-latest
            r: devel
            http-user-agent: release
            lc-ctype: C.UTF-8

          - os: ubuntu-latest
            r: release
            lc-ctype: C.UTF-8

          - os: ubuntu-latest
            r: oldrel-1
            lc-ctype: C.UTF-8

          # DESCRIPTION's R floor. No pins: a pinned package is a DIRECT ref, so
          # pak resolves its Suggests -- and ggplot2 suggests Hmisc, which now
          # needs R >= 4.2.0. Pinned here, the row failed to resolve for a
          # reason that had nothing to do with either floor.
          - os: ubuntu-latest
            r: "4.1"
            lc-ctype: C.UTF-8

          # Test the dependency-floor contract independently on release R.
          # Deployment environments do not pin this pair; the browser solver is
          # allowed to choose the newest compatible packages in its channels.
          - os: ubuntu-latest
            r: release
            label: dependency floor
            lc-ctype: C.UTF-8

          - os: windows-latest
            r: release
            lc-ctype: German_Germany.utf8

          - os: windows-latest
            r: devel
            http-user-agent: release
            lc-ctype: German_Germany.utf8

          - os: windows-latest
            r: oldrel-1
            lc-ctype: German_Germany.utf8

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Match CRAN and win-builder by checking undocumented dot-prefixed names.
      _R_CHECK_UNDOC_USE_ALL_NAMES_: "true"

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - name: Read graphics dependency floors
        if: matrix.config.label == 'dependency floor'
        id: graphics-floors
        shell: Rscript {0}
        run: |
          deps <- trimws(strsplit(read.dcf("DESCRIPTION")[1, "Imports"], ",")[[1]])
          deps <- deps[grepl("^(ggplot2|ggformula)\\s*\\(", deps)]
          pins <- sub("^([^[:space:]]+)\\s*\\(>=\\s*([^)]+)\\)$", "\\1@\\2", deps)
          stopifnot(length(pins) == 2L, all(grepl("^[[:alnum:]]+@[0-9.]+$", pins)))
          cat("packages=", paste(pins, collapse = " "), "\n",
              file = Sys.getenv("GITHUB_OUTPUT"), sep = "")

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # The action splits this on whitespace or commas, so a row with no pins
          # contributes a blank line and nothing else.
          extra-packages: |
            any::rcmdcheck
            ${{ steps.graphics-floors.outputs.packages }}
          needs: check

      - name: Verify graphics dependency floors
        if: matrix.config.label == 'dependency floor'
        env:
          GRAPHICS_FLOORS: ${{ steps.graphics-floors.outputs.packages }}
        shell: Rscript {0}
        run: |
          for (pin in strsplit(Sys.getenv("GRAPHICS_FLOORS"), " ")[[1]]) {
            parts <- strsplit(pin, "@", fixed = TRUE)[[1]]
            loadNamespace(parts[1])
            actual <- as.character(getNamespaceVersion(parts[1]))
            message(parts[1], ": ", actual)
            stopifnot(identical(actual, parts[2]))
          }
          # .github is excluded from the package tarball; check the source tree.
          testthat::test_local(filter = "^docs$", stop_on_failure = TRUE)

      - uses: r-lib/actions/check-r-package@v2
        env:
          LC_CTYPE: ${{ matrix.config.lc-ctype }}
        with:
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'

  # stable status check to require on main
  check:
    if: always()
    needs: R-CMD-check
    runs-on: ubuntu-latest
    name: check
    steps:
      - name: All platforms passed
        run: '[ "${{ needs.R-CMD-check.result }}" = "success" ] || exit 1'
