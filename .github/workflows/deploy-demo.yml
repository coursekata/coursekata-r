name: Deploy JupyterLite Demo

on:
  workflow_run:
    workflows: ["R-CMD-check"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: latest
          cache: true
          manifest-path: jupyterlite/pixi.toml

      - name: Build JupyterLite site
        run: cd jupyterlite && pixi run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: jupyterlite/app/_output
          # v4 began dropping dotfiles from the artifact
          include-hidden-files: true

  deploy:
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
